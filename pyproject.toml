[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrobora"
version = "0.1.0"
description = "A digital forensics framework for detecting indicators of anti-forensic activity on Windows systems through cross-artifact consistency analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dielle De Noon" },
]
keywords = [
    "digital-forensics",
    "dfir",
    "anti-forensics",
    "evtx",
    "ntfs",
    "prefetch",
    "windows-registry",
    "incident-response",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "python-evtx>=0.7.4",
    "python-registry>=1.3.1",
    "libscca-python>=20240427",
]

[project.optional-dependencies]
progress = ["tqdm>=4.60.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pylint>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Corrobora"
Repository = "https://github.com/yourusername/Corrobora"

# --- Console entry points -----------------------------------------------
# Lets you run e.g. `Corrobora-evtx Security.evtx` from anywhere on your
# PATH after `pip install .`, instead of `python evtx.py Security.evtx`
# from inside the source folder.
[project.scripts]
Corrobora-evtx = "evtx:_main"
Corrobora-registry = "registry:_main"
Corrobora-prefetch = "prefetch:_main"
Corrobora-mft = "mft:_main"
Corrobora-correlate = "correlation_engine:_main"
Corrobora-case = "case_ingest:_main"
Corrobora-gui = "Corrobora_gui:main"

# --- Package layout -------------------------------------------------------
# Corrobora's modules import each other with bare names (e.g.
# `from evtx import EvtxParser` inside correlation_engine.py), not
# dotted package paths (`from Corrobora.parsers.evtx import ...`).
# To keep those imports working exactly as-is -- and avoid another round
# of import-path breakage after everything was hard-won working -- these
# six files are installed as flat top-level modules rather than as a
# nested `Corrobora.parsers` package. This is a pragmatic tradeoff:
# generic module names like `evtx` or `registry` could theoretically
# collide with another installed package's top-level module name.
# A follow-up refactor to a proper namespaced `Corrobora.parsers.*`
# package (with corresponding relative imports) is recommended before
# any wider public distribution.
[tool.setuptools]
py-modules = ["evtx", "registry", "prefetch", "mft", "correlation_engine", "case_ingest", "Corrobora_gui"]
package-dir = { "" = "src/Corrobora/parsers" }

# --- Tooling configuration (matches what's been used throughout dev) -----
[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
extension-pkg-allow-list = ["pyscca"]