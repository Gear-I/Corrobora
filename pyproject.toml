[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrobora"
version = "0.1.0"
description = "A digital forensics framework for detecting indicators of anti-forensic activity on Windows systems through cross-artifact consistency analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dielle De Noon" },
]
keywords = [
    "digital-forensics",
    "dfir",
    "anti-forensics",
    "evtx",
    "ntfs",
    "prefetch",
    "windows-registry",
    "incident-response",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "python-evtx>=0.7.4",
    "python-registry>=1.3.1",
    "libscca-python>=20240427",
]

[project.optional-dependencies]
progress = ["tqdm>=4.60.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pylint>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Corrobora"
Repository = "https://github.com/yourusername/Corrobora"

# --- Console entry points -----------------------------------------------
# Lets you run e.g. `corrobora-evtx Security.evtx` from anywhere on your
# PATH after `pip install .`, instead of `python -m corrobora.parsers.evtx
# Security.evtx` from inside the source folder.
[project.scripts]
corrobora-evtx = "corrobora.parsers.evtx:_main"
corrobora-registry = "corrobora.parsers.registry:_main"
corrobora-prefetch = "corrobora.parsers.prefetch:_main"
corrobora-mft = "corrobora.parsers.mft:_main"
corrobora-correlate = "corrobora.parsers.correlation_engine:_main"
corrobora-case = "corrobora.parsers.case_ingest:_main"
corrobora-ez-import = "corrobora.parsers.ez_tools_import:_main"
corrobora-ez-run = "corrobora.parsers.ez_tools_orchestrator:_main"
corrobora-gui = "corrobora.parsers.corrobora_gui:main"
 
# --- Package layout -------------------------------------------------------
# Corrobora is a proper namespaced package: `corrobora.parsers.evtx`,
# `corrobora.parsers.correlation_engine`, etc. Modules within the package
# import each other via ordinary package-relative imports (e.g.
# `from .evtx import EvtxParser` inside correlation_engine.py), so there
# is no risk of a generic module name (`evtx`, `registry`, ...) colliding
# with another installed package's top-level module -- everything lives
# under the `corrobora` namespace.
[tool.setuptools.packages.find]
where = ["src"]
 
# --- Tooling configuration (matches what's been used throughout dev) -----
[tool.ruff]
line-length = 100
 
[tool.mypy]
ignore_missing_imports = true
 
[tool.pylint.format]
max-line-length = 100
 
[tool.pylint.main]
extension-pkg-allow-list = ["pyscca"]
 