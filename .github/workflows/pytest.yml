name: Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    # Corrobora analyses Windows artifacts but runs on any OS, and its
    # output must be identical everywhere (see docs/reproducible-testing.md),
    # so the tests run on all three.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # requires-python is >=3.11; the GUI and disk-image dependencies
        # publish prebuilt wheels for 3.11-3.13.
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # GUI tests import PyQt5 but never open a window; this keeps any Qt
      # initialization headless on the runner.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Corrobora with development extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q
